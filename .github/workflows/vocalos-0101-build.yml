name: Vocal OS 0.10.1 Full Parity Build

on:
  push:
    branches:
      - chatgpt-vocalos-0101-full-20260825
    paths:
      - 'ci-vocalos-0101/**'
      - '.github/workflows/vocalos-0101-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            ci-vocalos-0101/part-00 \
            ci-vocalos-0101/part-01 \
            ci-vocalos-0101/part-02 \
            ci-vocalos-0101/part-03 \
            ci-vocalos-0101/part-04a \
            ci-vocalos-0101/part-04b \
            ci-vocalos-0101/part-05 \
            ci-vocalos-0101/part-06 \
            ci-vocalos-0101/part-07 > /tmp/vocalos-source.b64
          base64 -d /tmp/vocalos-source.b64 > /tmp/vocalos-source.tar.gz
          echo '0b519f593a0b692d0be1becc8582d378242e3acce80c0bf1ec9ac8034394ae44  /tmp/vocalos-source.tar.gz' | sha256sum -c -
          mkdir -p /tmp/vocalos
          tar -xzf /tmp/vocalos-source.tar.gz -C /tmp/vocalos
          mv /tmp/vocalos/Vocal-OS-0.10.1-full-parity "$GITHUB_WORKSPACE/vocalos"

      - name: Restore upgrade identity and clean legacy runtime declarations
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci-vocalos-0101/alpha-key.b64 > vocalos/app/vocalos-alpha-dev.jks
          echo '87a081bf085c98776d18554ada0ff38b485e1568efaf91fca18a8f8171b80532  vocalos/app/vocalos-alpha-dev.jks' | sha256sum -c -
          cat > vocalos/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.vocalos.app'
              compileSdk 36
              defaultConfig {
                  applicationId 'com.vocalos.trainer'
                  minSdk 24
                  targetSdk 36
                  versionCode 11
                  versionName '0.10.1-full-parity'
              }
              signingConfigs {
                  alphaDev {
                      storeFile file('vocalos-alpha-dev.jks')
                      storePassword 'vocalos-alpha-2026'
                      keyAlias 'vocalos-alpha'
                      keyPassword 'vocalos-alpha-2026'
                  }
              }
              buildTypes {
                  debug {
                      applicationIdSuffix '.engine010full'
                      signingConfig signingConfigs.alphaDev
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.alphaDev
                  }
              }
          }
          EOF
          sed -i 's/android:label="Vocal OS 0.10.1 Full"/android:label="Vocal OS"/' vocalos/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vocalos/app/src/main/assets/runtime.js')
          s=p.read_text()
          names=['renderSkills','getAdaptivePattern','applyAdaptiveDefaults','beginGame','renderLibrary','resetAdaptation']
          for name in names:
              old=f'function {name}('
              i=s.find(old)
              if i < 0:
                  raise SystemExit(f'missing legacy declaration: {name}')
              s=s[:i]+f'function legacy_{name}('+s[i+len(old):]
          p.write_text(s)
          PY

      - name: Static parity and runtime QA
        shell: bash
        run: |
          set -euo pipefail
          node --check vocalos/app/src/main/assets/runtime.js
          python3 - <<'PY'
          from pathlib import Path
          import re, collections, xml.etree.ElementTree as ET
          p=Path('vocalos')
          idx=(p/'app/src/main/assets/index.html').read_text()
          run=(p/'app/src/main/assets/runtime.js').read_text()
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',idx,re.I)
          assert len(ids)==len(set(ids)), 'duplicate DOM ids'
          funcs=re.findall(r'(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(',run)
          dups={k:v for k,v in collections.Counter(funcs).items() if v>1}
          assert not dups, f'duplicate function declarations: {dups}'
          pos=idx.lower().rfind('</html>')
          assert pos >= 0 and idx[pos+7:].strip()=='', 'runtime exists after </html>'
          assert re.findall(r'<script[^>]+src=["\']([^"\']+)',idx,re.I)==['runtime.js']
          for needle in ['calibrationVersion=7','trainer.startAt=engineNowMs()','gameStart=engineNowMs()',"__gameJudge10='MISS'",'MISS','CLOSE','GOOD','PERFECT','MASTER']:
              assert needle in run, needle
          java=(p/'app/src/main/java/com/vocalos/app/MainActivity.java').read_text()
          assert 'RealtimeAudioEngine' in java and 'new AudioEngine' not in java
          for m in ['startAnalyzer','stopAnalyzer','suppressAnalyzer','startRecording','stopRecording','playTone','startDrone','stopDrone']:
              assert m+'(' in java, m
          ET.parse(p/'app/src/main/AndroidManifest.xml')
          print('static parity QA: OK; DOM ids=',len(ids),'duplicate functions=',dups)
          PY

      - name: Engine v2 synthetic regression
        shell: bash
        working-directory: vocalos
        run: |
          set -euo pipefail
          bash tools/run_engine_tests.sh | tee "$GITHUB_WORKSPACE/engine-tests.txt"

      - name: Build signed release APK
        shell: bash
        working-directory: vocalos
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK package, signature and archive
        shell: bash
        run: |
          set -euo pipefail
          APK=vocalos/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.vocalos.trainer' versionCode='11'" /tmp/badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep -qi '351e64f51bacc138c4f61da5167d1e905742f8f0985a6fb9cb6af9f6b344132f' /tmp/signature.txt
          {
            echo 'Vocal OS 0.10.1 Full Parity QA'
            echo 'package=com.vocalos.trainer'
            echo 'versionCode=11'
            echo 'versionName=0.10.1-full-parity'
            echo 'certificate_sha256=351e64f51bacc138c4f61da5167d1e905742f8f0985a6fb9cb6af9f6b344132f'
            sha256sum "$APK"
            echo
            cat /tmp/signature.txt
          } > qa-report.txt
          cp "$APK" Vocal-OS-0.10.1-full-parity.apk
          tar -czf Vocal-OS-0.10.1-full-parity-source.tar.gz -C vocalos .
          sha256sum Vocal-OS-0.10.1-full-parity.apk Vocal-OS-0.10.1-full-parity-source.tar.gz | tee hashes.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocal-OS-0.10.1-full-parity
          if-no-files-found: error
          retention-days: 7
          path: |
            Vocal-OS-0.10.1-full-parity.apk
            Vocal-OS-0.10.1-full-parity-source.tar.gz
            engine-tests.txt
            qa-report.txt
            hashes.txt
